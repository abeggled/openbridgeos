name: Release appliance update and installation images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version and tag, for example 2026.10.6
        required: true
        type: string
      prerelease:
        description: Publish as a GitHub prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: appliance-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  amd64-installer:
    name: Build amd64 installer ISO
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Pull pinned Debian ISO build environment
        run: docker pull debian:trixie-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f
      - name: Build and validate ISO
        run: |
          sudo docker run --rm --privileged \
            -e OBOS_RELEASE_BUILD=1 \
            -e OBOS_IMAGE_VERSION="${RELEASE_VERSION}" \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            debian:trixie-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f \
            sh -ec '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates git live-build xorriso
              git config --global --add safe.directory /work
              sh scripts/images/build-amd64-installer-iso.sh
            '
          sudo chown -R "$(id -u):$(id -g)" dist/images
          sh scripts/images/check-release-asset-size.sh \
            "dist/images/obos-amd64-installer-${RELEASE_VERSION}.iso"
      - name: Stage ISO release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: amd64-installer
          path: |
            dist/images/obos-amd64-installer-${{ inputs.version }}.iso
            dist/images/obos-amd64-installer-${{ inputs.version }}.iso.sha256
            dist/images/obos-amd64-installer-${{ inputs.version }}.iso.manifest
          compression-level: 0
          if-no-files-found: error

  amd64-vm:
    name: Build amd64 qcow2 image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install qcow2 builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl libguestfs-tools passt qemu-utils
          # GitHub's hosted runner has no usable IPv6 route. Keep passt for
          # working DNS, but force this isolated build appliance to IPv4.
          sudo install -m 0755 scripts/images/passt-ipv4-wrapper.sh /usr/local/bin/passt
          test "$(PATH=/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin command -v passt)" = /usr/local/bin/passt
      - name: Build and validate qcow2 image
        run: |
          sudo env PATH=/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            LIBGUESTFS_BACKEND=direct \
            OBOS_RELEASE_BUILD=1 OBOS_IMAGE_VERSION="${RELEASE_VERSION}" \
            sh scripts/images/build-amd64-qcow2.sh
          sudo chown -R "$(id -u):$(id -g)" dist/images
          sh scripts/images/check-release-asset-size.sh \
            "dist/images/obos-amd64-vm-${RELEASE_VERSION}.qcow2"
      - name: Stage qcow2 release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: amd64-vm
          path: |
            dist/images/obos-amd64-vm-${{ inputs.version }}.qcow2
            dist/images/obos-amd64-vm-${{ inputs.version }}.qcow2.sha256
            dist/images/obos-amd64-vm-${{ inputs.version }}.qcow2.manifest
          compression-level: 0
          if-no-files-found: error

  rpi4-arm64:
    name: Build Raspberry Pi 4+ arm64 image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Raspberry Pi image builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binfmt-support debootstrap dosfstools e2fsprogs fdisk mount parted \
            qemu-user-static tar util-linux xz-utils
      - name: Build and validate Raspberry Pi image
        run: |
          sudo env OBOS_RELEASE_BUILD=1 OBOS_IMAGE_VERSION="${RELEASE_VERSION}" \
            sh scripts/images/build-rpi4-arm64-image.sh
          sudo chown -R "$(id -u):$(id -g)" dist/images
          sh scripts/images/check-release-asset-size.sh \
            "dist/images/obos-rpi4-arm64-${RELEASE_VERSION}.img.xz"
      - name: Stage Raspberry Pi release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rpi4-arm64
          path: |
            dist/images/obos-rpi4-arm64-${{ inputs.version }}.img.xz
            dist/images/obos-rpi4-arm64-${{ inputs.version }}.img.xz.sha256
            dist/images/obos-rpi4-arm64-${{ inputs.version }}.img.xz.manifest
          compression-level: 0
          if-no-files-found: error

  release:
    name: Sign and publish complete release
    if: github.ref == 'refs/heads/main'
    needs: [amd64-installer, amd64-vm, rpi4-arm64]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_PRERELEASE: ${{ inputs.prerelease }}
      OBOS_RELEASE_MINISIGN_SECRET_KEY: ${{ secrets.OBOS_RELEASE_MINISIGN_SECRET_KEY }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Download validated image files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*'
          path: dist/images
          merge-multiple: true
      - name: Validate release request
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_VERSION}" =~ ^[0-9]+([.][0-9]+){1,3}([+~-][A-Za-z0-9.]+)?$ ]]
          test -s RELEASENOTES.md
          test -s packaging/update/obos-release.minisign.pub
          test -n "${OBOS_RELEASE_MINISIGN_SECRET_KEY}"
          if git rev-parse --verify --quiet "refs/tags/${RELEASE_VERSION}"; then
            echo "Refusing to replace existing tag ${RELEASE_VERSION}" >&2
            exit 1
          fi
          if gh release view "${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Refusing to replace existing release ${RELEASE_VERSION}" >&2
            exit 1
          fi
      - name: Install release signing tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
      - name: Build and sign release manifests
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/obos-release-${RELEASE_VERSION}"
          key_file="${RUNNER_TEMP}/obos-release.minisign.key"
          install -d -m 0700 "${release_dir}"
          install -m 0600 /dev/null "${key_file}"
          printf '%s\n' "${OBOS_RELEASE_MINISIGN_SECRET_KEY}" > "${key_file}"
          sh scripts/update/create-update-bundle.sh \
            "${RELEASE_VERSION}" "${release_dir}" RELEASENOTES.md
          minisign -Sm "${release_dir}/obos-update.manifest" \
            -s "${key_file}" \
            -W -t "OBOS appliance release ${RELEASE_VERSION}"
          minisign -Vm "${release_dir}/obos-update.manifest" \
            -p packaging/update/obos-release.minisign.pub
          sh scripts/images/create-release-manifest.sh \
            "dist/images/obos-images-${RELEASE_VERSION}.manifest" \
            "dist/images/obos-amd64-installer-${RELEASE_VERSION}.iso.manifest" \
            "dist/images/obos-amd64-vm-${RELEASE_VERSION}.qcow2.manifest" \
            "dist/images/obos-rpi4-arm64-${RELEASE_VERSION}.img.xz.manifest"
          minisign -Sm "dist/images/obos-images-${RELEASE_VERSION}.manifest" \
            -s "${key_file}" \
            -W -t "OBOS installation images ${RELEASE_VERSION}"
          public_key="$(sed -n '2p' packaging/update/obos-release.minisign.pub)"
          OBOS_RELEASE_SIGNATURE_STRICT=1 OBOS_RELEASE_MINISIGN_PUBLIC_KEY="${public_key}" \
            sh scripts/images/check-release-manifest.sh \
              "dist/images/obos-images-${RELEASE_VERSION}.manifest"
          sha256sum -c dist/images/*.sha256
          sh scripts/images/check-release-asset-size.sh \
            "dist/images/obos-amd64-installer-${RELEASE_VERSION}.iso" \
            "dist/images/obos-amd64-vm-${RELEASE_VERSION}.qcow2" \
            "dist/images/obos-rpi4-arm64-${RELEASE_VERSION}.img.xz"
          echo "RELEASE_DIR=${release_dir}" >> "${GITHUB_ENV}"
      - name: Publish immutable GitHub release
        shell: bash
        run: |
          set -euo pipefail
          release_args=(
            "${RELEASE_VERSION}"
            "${RELEASE_DIR}/obos-update.tar.gz"
            "${RELEASE_DIR}/obos-update.manifest"
            "${RELEASE_DIR}/obos-update.manifest.minisig"
            "${RELEASE_DIR}/obos-update-notes.txt"
            packaging/update/obos-release.minisign.pub
            dist/images/*
            --target "${GITHUB_SHA}"
            --title "open bridge operating system ${RELEASE_VERSION}"
            --notes-file RELEASENOTES.md
          )
          if [[ "${RELEASE_PRERELEASE}" == true ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
