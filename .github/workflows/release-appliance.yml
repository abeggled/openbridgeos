name: Release appliance update

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version and tag, for example 2026.10.0
        required: true
        type: string
      prerelease:
        description: Publish as a GitHub prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: appliance-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_PRERELEASE: ${{ inputs.prerelease }}
      OBOS_RELEASE_MINISIGN_SECRET_KEY: ${{ secrets.OBOS_RELEASE_MINISIGN_SECRET_KEY }}

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Validate release request
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_VERSION}" =~ ^[0-9]+([.][0-9]+){1,3}([+~-][A-Za-z0-9.]+)?$ ]]
          test -s RELEASENOTES.md
          test -s packaging/update/obos-release.minisign.pub
          test -n "${OBOS_RELEASE_MINISIGN_SECRET_KEY}"
          if git rev-parse --verify --quiet "refs/tags/${RELEASE_VERSION}"; then
            echo "Refusing to replace existing tag ${RELEASE_VERSION}" >&2
            exit 1
          fi
          if gh release view "${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Refusing to replace existing release ${RELEASE_VERSION}" >&2
            exit 1
          fi

      - name: Install release signing tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      - name: Build signed appliance update assets
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/obos-release-${RELEASE_VERSION}"
          key_file="${RUNNER_TEMP}/obos-release.minisign.key"
          install -d -m 0700 "${release_dir}"
          install -m 0600 /dev/null "${key_file}"
          printf '%s\n' "${OBOS_RELEASE_MINISIGN_SECRET_KEY}" > "${key_file}"
          sh scripts/update/create-update-bundle.sh \
            "${RELEASE_VERSION}" \
            "${release_dir}" \
            RELEASENOTES.md
          minisign -Sm "${release_dir}/obos-update.manifest" \
            -s "${key_file}" \
            -W \
            -t "OBOS appliance release ${RELEASE_VERSION}"
          minisign -Vm "${release_dir}/obos-update.manifest" \
            -p packaging/update/obos-release.minisign.pub
          sha256sum \
            "${release_dir}/obos-update.tar.gz" \
            "${release_dir}/obos-update-notes.txt" \
            "${release_dir}/obos-update.manifest"
          echo "RELEASE_DIR=${release_dir}" >> "${GITHUB_ENV}"

      - name: Publish immutable GitHub release
        shell: bash
        run: |
          set -euo pipefail
          release_args=(
            "${RELEASE_VERSION}"
            "${RELEASE_DIR}/obos-update.tar.gz"
            "${RELEASE_DIR}/obos-update.manifest"
            "${RELEASE_DIR}/obos-update.manifest.minisig"
            "${RELEASE_DIR}/obos-update-notes.txt"
            "packaging/update/obos-release.minisign.pub"
            --target "${GITHUB_SHA}"
            --title "open bridge operating system ${RELEASE_VERSION}"
            --notes-file RELEASENOTES.md
          )
          if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
