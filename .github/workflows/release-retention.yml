name: Enforce release retention

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prune:
    name: Keep one prerelease and three stable releases
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Enforce retention
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/update/prune-github-releases.sh --confirm
