name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate project files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install checks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables shellcheck

      - name: Shell syntax
        run: |
          shellcheck scripts/obosctl scripts/bootstrap/*.sh scripts/checks/*.sh scripts/hardening/*.sh

      - name: nftables syntax
        run: sudo nft -c -f packaging/nftables/obos.nft

      - name: Security defaults
        run: sh scripts/checks/check-security-defaults.sh

      - name: Compose config
        run: sh scripts/checks/validate-compose.sh
