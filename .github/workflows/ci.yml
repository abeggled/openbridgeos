name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate project files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install checks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends logrotate nftables shellcheck nginx

      - name: Shell syntax
        run: |
          shellcheck scripts/obosctl scripts/agent/*.sh scripts/audit/*.sh scripts/auth/*.sh scripts/bootstrap/*.sh scripts/checks/*.sh scripts/hardening/*.sh scripts/images/*.sh scripts/tls/*.sh

      - name: sudoers syntax
        run: sudo visudo -cf packaging/sudoers/obos-agent

      - name: logrotate syntax
        run: |
          sudo useradd --system --no-create-home --user-group obos-agent
          sudo logrotate --debug packaging/logrotate/obos-agent

      - name: Docker daemon JSON syntax
        run: python -m json.tool packaging/docker/daemon.json >/dev/null

      - name: nftables syntax
        run: sudo nft -c -f packaging/nftables/obos.nft

      - name: nginx syntax
        run: |
          sudo install -d -m 0700 /etc/obos/tls
          sudo openssl req -x509 -nodes -newkey rsa:2048 \
            -subj "/CN=ci.obos.local" \
            -keyout /etc/obos/tls/obos.local.key \
            -out /etc/obos/tls/obos.local.crt \
            -days 1
          sudo install -m 0644 packaging/nginx/openbridgeserver.conf /etc/nginx/sites-available/obos-openbridgeserver.conf
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo ln -sf /etc/nginx/sites-available/obos-openbridgeserver.conf /etc/nginx/sites-enabled/obos-openbridgeserver.conf
          sudo nginx -t

      - name: Security defaults
        run: sh scripts/checks/check-security-defaults.sh

      - name: Web UI agent contract
        run: sh scripts/checks/check-web-ui-agent-contract.sh

      - name: obos-agent
        run: sh scripts/checks/check-obos-agent.sh

      - name: obos-agent-http
        run: sh scripts/checks/check-obos-agent-http.sh

      - name: obos-web
        run: sh scripts/checks/check-obos-web.sh

      - name: MVP readiness
        run: sh scripts/checks/check-mvp-readiness.sh

      - name: MVP runtime readiness fixture
        run: sh scripts/checks/check-mvp-runtime-readiness.sh

      - name: Image profiles
        run: sh scripts/images/validate-image-profiles.sh

      - name: Image profile fixture
        run: sh scripts/checks/check-image-profiles.sh

      - name: Image build plan fixture
        run: sh scripts/checks/check-image-build-plan.sh

      - name: qcow2 manifest fixture
        run: sh scripts/checks/check-qcow2-manifest.sh

      - name: Raspberry Pi kernel config fixture
        run: sh scripts/checks/check-rpi-kernel-config.sh

      - name: Raspberry Pi boot files fixture
        run: sh scripts/checks/check-rpi-boot-files.sh

      - name: Raspberry Pi image manifest fixture
        run: sh scripts/checks/check-rpi-image-manifest.sh

      - name: Release manifest fixture
        run: sh scripts/checks/check-release-manifest.sh

      - name: Image release validation record fixture
        run: sh scripts/checks/check-image-release-validation-record.sh

      - name: Image validation record template fixture
        run: sh scripts/checks/check-image-validation-record-template.sh

      - name: Release candidate fixture
        run: sh scripts/checks/check-release-candidate.sh

      - name: Release evidence bundle fixture
        run: sh scripts/checks/check-release-evidence-bundle.sh

      - name: TLS leaf renewal plan fixture
        run: sh scripts/checks/check-tls-leaf-renewal-plan.sh

      - name: TLS leaf renewal fixture
        run: sh scripts/checks/check-tls-leaf-renewal.sh

      - name: Compose config
        run: sh scripts/checks/validate-compose.sh

      - name: Compose image pinning
        run: sh scripts/checks/check-compose-image-pinning.sh
