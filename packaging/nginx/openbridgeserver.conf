server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name _;
  server_tokens off;

  ssl_certificate /etc/obos/tls/obos.local.crt;
  ssl_certificate_key /etc/obos/tls/obos.local.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:OBOSSSL:10m;
  ssl_session_tickets off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options SAMEORIGIN always;

  client_max_body_size 64m;
  client_body_timeout 30s;
  client_header_timeout 30s;
  send_timeout 60s;

  location = /obos {
    return 302 /obos/;
  }

  location = /obos/onboarding {
    return 302 /obos/onboarding/;
  }

  location = /obos/onboarding/ {
    auth_basic off;
    root /srv/obos/onboarding;
    try_files /index.html =404;
  }

  location = /obos/onboarding/index.html {
    auth_basic off;
    root /srv/obos/onboarding;
    try_files /index.html =404;
  }

  location = /obos/onboarding/styles.css {
    auth_basic off;
    root /srv/obos/onboarding;
    try_files /styles.css =404;
  }

  location = /obos/onboarding/onboarding.js {
    auth_basic off;
    root /srv/obos/onboarding;
    try_files /onboarding.js =404;
  }

  location ^~ /obos/onboarding/ {
    auth_basic off;
    return 404;
  }

  location /obos/api/v1/onboarding/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location = /obos/ {
    root /srv/obos/web;
    try_files /index.html =404;
  }

  location = /obos/index.html {
    root /srv/obos/web;
    try_files /index.html =404;
  }

  location = /obos/styles.css {
    root /srv/obos/web;
    try_files /styles.css =404;
  }

  location = /obos/app.js {
    root /srv/obos/web;
    try_files /app.js =404;
  }

  location ^~ /obos/ {
    return 404;
  }

  location /obos/api/ {
    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location = /visu {
    return 302 /visu/;
  }

  location /visu/ {
    proxy_pass http://127.0.0.1:8080/visu/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
  }

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
  }
}
