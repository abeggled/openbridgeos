menuentry 'Manual graphical installer' --hotkey=i {
	linux @KERNEL_GI@ vga=788 --- quiet
	initrd @INITRD_GI@
}

menuentry 'Expert graphical installer' --hotkey=x {
	linux @KERNEL_GI@ priority=low vga=788
	initrd @INITRD_GI@
}

menuentry 'Rescue mode' --hotkey=r {
	linux @KERNEL_GI@ rescue/enable=true vga=788 --- quiet
	initrd @INITRD_GI@
}

