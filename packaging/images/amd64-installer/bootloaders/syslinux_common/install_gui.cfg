label installstart
	menu label Start ^installer
	linux @KERNEL_GI@
	initrd @INITRD_GI@
	append auto=true priority=critical file=/cdrom/install/preseed.cfg vga=788 --- quiet

menu begin install
	menu label ^Advanced install options
	menu title Advanced install options
	include stdmenu.cfg
	label mainmenu
		menu label ^Back..
		menu exit

	label installgui
		menu label ^Manual graphical installer
		linux @KERNEL_GI@
		initrd @INITRD_GI@
		append vga=788 --- quiet

	label expertgui
		menu label E^xpert graphical installer
		linux @KERNEL_GI@
		initrd @INITRD_GI@
		append priority=low vga=788

	label rescuegui
		menu label ^Rescue mode
		linux @KERNEL_GI@
		initrd @INITRD_GI@
		append rescue/enable=true vga=788 --- quiet
menu end

